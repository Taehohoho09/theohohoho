<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃‍♂️ 무한의 계단 오르기!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 450px;
            height: 700px;
            background: linear-gradient(180deg, #1f1c2c, #928dab);
            border: 4px solid #444;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        #score {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
        }
        #timer-bar-container {
            width: 80%;
            height: 16px;
            background-color: rgba(0,0,0,0.4);
            border-radius: 8px;
            margin-top: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }
        #timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.05s linear;
        }

        /* 시작 & 결과 화면 */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 36px;
            color: #ff4b2b;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }
        p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .controls-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .key-badge {
            background-color: #ff4b2b;
            color: #fff;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .start-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 상단 UI -->
        <div id="ui-layer">
            <div id="score">0</div>
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
        </div>

        <!-- 시작 / 게임 오버 화면 -->
        <div id="overlay" class="overlay-screen">
            <h1 id="overlay-title">무한의 계단</h1>
            <p id="overlay-desc">끝없이 계속되는 계단을 정복하세요!</p>
            
            <div class="controls-box">
                <p style="margin-bottom: 8px;">🎮 <strong>조작법</strong></p>
                <p><span class="key-badge">Space</span> : 그대로 오르기</p>
                <p style="margin-bottom: 0;"><span class="key-badge">Enter</span> : 방향 틀어서 오르기</p>
            </div>

            <button class="start-btn" id="start-btn" onclick="startGame()">게임 시작</button>
        </div>

        <canvas id="game-canvas" width="450" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const timerBar = document.getElementById('timer-bar');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');

        // 게임 설정값
        const STEP_W = 60;   // 계단 너비
        const STEP_H = 36;   // 계단 높이
        const MAX_TIME = 100;

        // 게임 상태 변수
        let score = 0;
        let gameRunning = false;
        let timer = MAX_TIME;
        let timerInterval = null;

        // 플레이어 상태
        // direction: 1 (우상향 계단 바라봄), -1 (좌상향 계단 바라봄)
        let player = {
            stepIndex: 0,
            dir: 1
        };

        // 계단 데이터 (오른쪽: 1, 왼쪽: -1)
        // stairs[i]는 i번째 계단에서 i+1번째 계단으로 올라갈 때의 상대 방향
        let stairs = [];

        // 화면 카메라 스크롤을 위한 시각적 오프셋
        let cameraY = 0;
        let targetCameraY = 0;

        // 게임 생성 및 시작
        function startGame() {
            score = 0;
            timer = MAX_TIME;
            scoreEl.innerText = score;
            timerBar.style.width = '100%';

            player.stepIndex = 0;
            player.dir = 1;

            // 계단 초기화 (첫 계단은 오른쪽 방향으로 시작)
            stairs = [0]; // 0번 위치(시작점)
            generateStairs(50);

            gameRunning = true;
            overlay.style.display = 'none';

            // 타이머 시작 (점수가 높을수록 빠르게 감소)
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameRunning) return;
                
                // 점수에 비례해 줄어드는 속도 증가
                let decreaseRate = 1.2 + Math.min(score * 0.02, 3.5);
                timer -= decreaseRate;
                
                if (timer <= 0) {
                    timer = 0;
                    gameOver("⏰ 시간 초과!");
                }
                timerBar.style.width = `${timer}%`;
            }, 50);

            requestAnimationFrame(render);
        }

        // 무작위 계단 생성
        function generateStairs(count) {
            let lastDir = stairs.length > 1 ? stairs[stairs.length - 1] : 1;
            for (let i = 0; i < count; i++) {
                // 연속해서 같은 방향이 나올 확률 70%, 방향 전환 30%
                if (Math.random() < 0.3) {
                    lastDir *= -1;
                }
                stairs.push(lastDir);
            }
        }

        // 입력 처리 (키보드)
        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            if (e.code === 'Space') {
                e.preventDefault();
                stepUp(false); // 방향 변경 없이 진행
            } else if (e.code === 'Enter') {
                e.preventDefault();
                stepUp(true);  // 방향 변경 후 진행
            }
        });

        // 계단 오르기 로직
        function stepUp(changeDirection) {
            if (changeDirection) {
                player.dir *= -1; // 방향 전환
            }

            const nextStepIndex = player.stepIndex + 1;

            // 다음 계단 위치의 정답 방향과 플레이어의 방향 비교
            if (stairs[nextStepIndex] === player.dir) {
                // 성공!
                player.stepIndex = nextStepIndex;
                score++;
                scoreEl.innerText = score;

                // 타이머 약간 회복
                timer = Math.min(timer + 8, MAX_TIME);
                timerBar.style.width = `${timer}%`;

                // 계단 부족 시 추증
                if (stairs.length - player.stepIndex < 20) {
                    generateStairs(30);
                }
            } else {
                // 실패 (틀린 방향)
                gameOver("💥 발을 헛디뎠습니다!");
            }
        }

        // 계단의 좌표 계산 함수 (step index -> screen pixel)
        function getStepPos(index) {
            let x = canvas.width / 2;
            let y = canvas.height - 150;

            for (let i = 1; i <= index; i++) {
                x += stairs[i] * STEP_W;
                y -= STEP_H;
            }
            return { x, y };
        }

        // 게임 오버
        function gameOver(reason) {
            gameRunning = false;
            clearInterval(timerInterval);

            overlayTitle.innerText = "게임 오버!";
            overlayDesc.innerHTML = `${reason}<br><br>최종 점수: <strong>${score} 계단</strong>`;
            document.getElementById('start-btn').innerText = "다시 도전";
            overlay.style.display = 'flex';
        }

        // 렌더링 루프 (그리기)
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 현재 플레이어 위치 기반 카메라 연출 (부드러운 추적)
            const currentPos = getStepPos(player.stepIndex);
            targetCameraY = currentPos.y - (canvas.height - 250);
            cameraY += (targetCameraY - cameraY) * 0.2;

            ctx.save();
            ctx.translate(0, -cameraY);

            // 1. 계단 그리기
            let startDraw = Math.max(1, player.stepIndex - 10);
            let endDraw = Math.min(stairs.length - 1, player.stepIndex + 20);

            for (let i = startDraw; i <= endDraw; i++) {
                let pos = getStepPos(i);

                // 계단 블록
                ctx.fillStyle = (i % 2 === 0) ? '#ffb703' : '#fb8500';
                ctx.fillRect(pos.x - STEP_W / 2, pos.y, STEP_W, STEP_H);

                // 계단 테두리
                ctx.strokeStyle = '#023047';
                ctx.lineWidth = 3;
                ctx.strokeRect(pos.x - STEP_W / 2, pos.y, STEP_W, STEP_H);
            }

            // 2. 플레이어 그리기
            ctx.fillStyle = '#219ebc';
            // 몸통
            ctx.fillRect(currentPos.x - 15, currentPos.y - 45, 30, 45);

            // 눈 (방향에 따라 시선 처리)
            ctx.fillStyle = '#fff';
            let eyeX = player.dir === 1 ? currentPos.x + 3 : currentPos.x - 11;
            ctx.fillRect(eyeX, currentPos.y - 38, 8, 8);
            ctx.fillStyle = '#000';
            ctx.fillRect(player.dir === 1 ? eyeX + 4 : eyeX, currentPos.y - 36, 4, 4);

            // 모자/헤어
            ctx.fillStyle = '#e63946';
            ctx.fillRect(currentPos.x - 18, currentPos.y - 50, 36, 8);

            ctx.restore();

            if (gameRunning) {
                requestAnimationFrame(render);
            }
        }
    </script>
</body>
</html>
